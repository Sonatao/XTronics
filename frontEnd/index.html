<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTronics Demo</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js" ></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js" data-cellstyles="true" ></script>
    <link rel="stylesheet" href="../styles.css">
    <script src="crud.js" defer></script>
</head>

<body>
    <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
<main>

    <section class="title">
        <h1>Welcome to XTronics Demo</h1>
        <p>This is just to show off the functionality as a ticket system.</p>
    </section>

    <section class="informationTable">
        <h2>Demo Table</h2>

        <table id="orderTable">
            <thead>
                <tr>
                    <th></th> <!-- Arrow column -->
                    <th>Order Date</th>
                    <th>Customer Name</th>
                    <th>Buyer</th>
                    <th>PO#</th>
                    <th>Part#</th>
                    <th>Shipping Method</th>
                    <th>Notes</th>
                    <th>Tracking #</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
            <div class="exportButtons">
                <button id="exportSingle" class="action-btn export">Export Selected Ticket</button>
                <button id="exportAll" class="action-btn export">Export All Tickets</button>
            </div>
        </table>
    </section>

    <h3>Order Ticket Form</h3>
    <form id="orderForm">
        <input type="date" id="orderDate" required>
        <input type="text" id="customerName" placeholder="Customer Name" required>
        <input type="text" id="buyer" placeholder="Buyer" required>
        <input type="text" id="poNumber" placeholder="PO#" required>
        <input type="text" id="partNumber" placeholder="Part#" required>
        <input type="text" id="shippingMethod" placeholder="Shipping Method" required>
        <input type="text" id="notes" placeholder="Notes">
        <input type="text" id="trackingNumber" placeholder="Tracking #" required>
        <input type="text" id="status" placeholder="Status" required>

        <button type="submit">Add Order</button>
    </form>

    <!-- EDIT POPUP MODAL -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h1>Edit Ticket</h1>

            <form id="editForm">
                <h3>Edit Order</h3>

                <input type="date" id="editOrderDate" required>
                <input type="text" id="editCustomerName" placeholder="Customer Name" required>
                <input type="text" id="editBuyer" placeholder="Buyer" required>
                <input type="text" id="editPoNumber" placeholder="PO#" required>
                <input type="text" id="editPartNumber" placeholder="Part#" required>
                <input type="text" id="editShippingMethod" placeholder="Shipping Method" required>
                <input type="text" id="editNotes" placeholder="Notes">
                <input type="text" id="editTrackingNumber" placeholder="Tracking #" required>
                <input type="text" id="editStatus" placeholder="Status" required>

                <button type="submit">Save Changes</button>
                <button type="button" id="closeModal">Cancel</button>
            </form>
        </div>
    </div>

</main>
</body>
</html>
